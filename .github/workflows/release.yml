name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Version from the tag: v1.2.3 → versionName 1.2.3, versionCode 10203,
      # so every higher tag installs over the previous release (re-runs and
      # failed runs don't shift it, unlike the run number).
      - name: Version from tag
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH (minor/patch < 100)"; exit 1
          fi
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
          echo "VERSION_CODE=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))" >> "${GITHUB_ENV}"

      - name: Unit tests + unsigned release build
        run: >
          ./gradlew testDebugUnitTest assembleRelease
          -PappVersionName="${VERSION_NAME}"
          -PappVersionCode="${VERSION_CODE}"

      # The keystore exists only in repository secrets; it is decoded to the
      # runner's temp dir, used once, and never echoed or uploaded.
      - name: Sign the APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          KS="${RUNNER_TEMP}/release.keystore"
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "${KS}"
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="xiaomi-scale-sync-${GITHUB_REF_NAME}.apk"
          "${BT}/zipalign" -p -f 4 "${IN}" "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" sign \
            --ks "${KS}" \
            --ks-key-alias "${RELEASE_KEY_ALIAS}" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEYSTORE_PASSWORD \
            --out "${OUT}" "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" verify --print-certs "${OUT}"
          rm -f "${KS}"
          echo "APK=${OUT}" >> "${GITHUB_ENV}"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${APK}" --title "${GITHUB_REF_NAME}" --generate-notes
