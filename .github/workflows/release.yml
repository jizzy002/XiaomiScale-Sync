name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Version from the tag (v0.1.0 → versionName 0.1.0); versionCode
      # from the run number so every release installs over the previous one.
      - name: Unit tests + unsigned release build
        run: >
          ./gradlew testDebugUnitTest assembleRelease
          -PappVersionName="${GITHUB_REF_NAME#v}"
          -PappVersionCode="${{ github.run_number }}"

      # The keystore exists only in repository secrets; it is decoded to the
      # runner's temp dir, used once, and never echoed or uploaded.
      - name: Sign the APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          KS="${RUNNER_TEMP}/release.keystore"
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "${KS}"
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="xiaomi-scale-sync-${GITHUB_REF_NAME}.apk"
          "${BT}/zipalign" -p -f 4 "${IN}" "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" sign \
            --ks "${KS}" \
            --ks-key-alias "${RELEASE_KEY_ALIAS}" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEYSTORE_PASSWORD \
            --out "${OUT}" "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" verify --print-certs "${OUT}"
          rm -f "${KS}"
          echo "APK=${OUT}" >> "${GITHUB_ENV}"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${APK}" --title "${GITHUB_REF_NAME}" --generate-notes
